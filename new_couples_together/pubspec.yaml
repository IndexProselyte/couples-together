name: new_couples_together
description: "A local couples journal and shared-memory Flutter prototype."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  confetti: ^0.7.0
  video_player: ^2.9.2
  home_widget: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
   - assets/stickers/hamster/
  fonts:
    - family: Aktura
      fonts:
        - asset: fonts/Aktura-Regular.otf

    - family: Array
      fonts:
        - asset: fonts/Array-Regular.otf
        - asset: fonts/Array-Bold.otf
          weight: 700
        - asset: fonts/Array-Semibold.otf
          weight: 600

    - family: Array Wide
      fonts:
        - asset: fonts/Array-Wide.otf
        - asset: fonts/Array-BoldWide.otf
          weight: 700
        - asset: fonts/Array-SemiboldWide.otf
          weight: 600

    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Thin.otf
          weight: 100
        - asset: fonts/JetBrainsMono-ThinItalic.otf
          weight: 100
          style: italic
        - asset: fonts/JetBrainsMono-ExtraLight.otf
          weight: 200
        - asset: fonts/JetBrainsMono-ExtraLightItalic.otf
          weight: 200
          style: italic
        - asset: fonts/JetBrainsMono-Light.otf
          weight: 300
        - asset: fonts/JetBrainsMono-LightItalic.otf
          weight: 300
          style: italic
        - asset: fonts/JetBrainsMono-Regular.otf
          weight: 400
        - asset: fonts/JetBrainsMono-Italic.otf
          weight: 400
          style: italic
        - asset: fonts/JetBrainsMono-Medium.otf
          weight: 500
        - asset: fonts/JetBrainsMono-MediumItalic.otf
          weight: 500
          style: italic
        - asset: fonts/JetBrainsMono-SemiBold.otf
          weight: 600
        - asset: fonts/JetBrainsMono-SemiBoldItalic.otf
          weight: 600
          style: italic
        - asset: fonts/JetBrainsMono-Bold.otf
          weight: 700
        - asset: fonts/JetBrainsMono-BoldItalic.otf
          weight: 700
          style: italic
        - asset: fonts/JetBrainsMono-ExtraBold.otf
          weight: 800
        - asset: fonts/JetBrainsMono-ExtraBoldItalic.otf
          weight: 800
          style: italic

